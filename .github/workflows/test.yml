name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    # the Rust core (crates/, bench/notes/2026-11-24-rust-plan.ja.md): format, lints, its tests, the oldest Rust promised
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: fmt / clippy / test
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p wireskein-core --locked

      - name: Build with the oldest Rust (rust-version 1.88)
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --workspace --locked

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Fetch the viewer (wireskein-web, pinned in tools/web.json)
        run: python tools/fetch_web.py

      - name: Run tests
        run: uv run --python ${{ matrix.python }} pytest tests

      - name: Build package
        run: uv build
