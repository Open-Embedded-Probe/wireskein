name: Release

# One release for everything (bench/notes/2026-11-24-rust-plan.ja.md §51): the version bumped and tagged (prepare),
# then built from that tag (build.yml: the wheels with the Rust core built in and the sdist, the app's archives),
# the GitHub release with the app's archives, and PyPI with the wheels and the sdist. An app unchanged since the last
# release is released again under the new version.

on:
  workflow_dispatch:
    inputs:
      version_level:
        description: "Version component to bump (the version in pyproject.toml is the current one)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      version:
        description: "Release version instead (X.Y.Z, or X.Y.ZbN for a beta); empty: bump by version_level"
        required: false
        default: ""
      publish_pypi:
        description: "Publish package to PyPI"
        required: true
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Run release preparation
        id: prepare
        env:
          VERSION: ${{ github.event.inputs.version }}
          LEVEL: ${{ github.event.inputs.version_level }}
        run: uv run python tools/prepare_release.py --version "$VERSION" --level "$LEVEL" --github-output "$GITHUB_OUTPUT"

      - name: Fetch the viewer (wireskein-web, pinned in tools/web.json)
        run: python tools/fetch_web.py

      # (uv run builds the Rust core in place first)
      - name: Run tests
        run: uv run pytest tests

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/wireskein/__init__.py CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): v${{ steps.prepare.outputs.version }}"

      - name: Create tag
        run: git tag "v${{ steps.prepare.outputs.version }}"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin "v${{ steps.prepare.outputs.version }}"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: "v${{ needs.prepare.outputs.version }}"

  create_github_release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.version }}"
          fetch-depth: 0

      - name: Build release body from CHANGELOG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          current_tag = f"v{version}"

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          section_header = f"## {version}"

          try:
              start = changelog.index(section_header)
          except ValueError as exc:
              raise SystemExit(f"Version section {section_header} not found in CHANGELOG.md") from exc

          end = len(changelog)
          for i in range(start + 1, len(changelog)):
              if changelog[i].startswith("## "):
                  end = i
                  break

          section = "\n".join(changelog[start:end]).strip()
          body = section + "\n\nRepository: https://github.com/Open-Embedded-Probe/wireskein"

          tags = (
              subprocess.check_output(
                  ["git", "tag", "--list", "v*", "--sort=v:refname"],
                  text=True,
              )
              .strip()
              .splitlines()
          )

          prev_tag = ""
          for i, tag in enumerate(tags):
              if tag == current_tag and i > 0:
                  prev_tag = tags[i - 1]
                  break

          if prev_tag:
              body += (
                  "\n\nFull Changelog: "
                  "https://github.com/Open-Embedded-Probe/wireskein/compare/"
                  f"{prev_tag}...{current_tag}"
              )

          Path("release_body.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Fetch the app's archives
        uses: actions/download-artifact@v8
        with:
          pattern: app-*
          merge-multiple: true
          path: app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          body_path: release_body.md
          files: app/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'a') || contains(needs.prepare.outputs.version, 'b') || contains(needs.prepare.outputs.version, 'rc') }}

  publish_pypi:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: ${{ github.event.inputs.publish_pypi == 'true' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Fetch the wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Fetch the sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
