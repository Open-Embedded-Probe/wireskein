name: Bench

# The algorithm bench (bench/README.md) on GitHub's runners: started by hand, the cases split over parallel jobs (all
# algorithms of a case in one job, so that costs against main pair up), merged into ledger lines and committed to the
# branch it ran on (bench/results/ledger.jsonl, runs.jsonl: added lines only; "commit" off for a try). Every item is
# kept as the artifact bench-<run id> (uv run python bench/merge.py --import DIR takes it into a ledger).
# Scores are the same on any machine; times on shared runners are not (see bench/README.md 1.7).

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages (e2e: the check of a commit on main)"
        type: choice
        options: ["e2e", "all", "clock_period", "bit_unit", "clean", "grouping", "lineclass", "segments"]
        default: "e2e"
      suites:
        description: "Suites of bench/suites.toml (all: every suite; tune: those for tuning; (other): those in other)"
        type: choice
        options: ["all", "tune", "quick", "quick-noise", "smoke", "noise", "noise-holdout", "protocols", "protomix",
                  "spi-shapes", "uartlike", "pulse", "real", "real-i2c", "scale", "(other)"]
        default: "all"
      algos:
        description: "Algorithms (wireskein alone runs no gate; engine: every engine of bench/engines; (status ...): every algorithm of those statuses; (other): those in other)"
        type: choice
        options: ["wireskein engine.rust", "wireskein", "engine", "wireskein engine", "engine.light", "engine.views", "engine.declarative",
                  "engine.learned", "engine.synth", "engine.open", "engine.rust", "engine.light_open engine.declarative_open engine.synth_open engine.learned_open",
                  "(status main,trial)", "(status main,trial,retired)", "(other)"]
        default: "wireskein engine.rust"
      other:
        description: "With (other): suites or algorithms by name, space separated (both (other): suites | algorithms)"
        default: ""
      shards:
        description: "Parallel jobs (1-20)"
        default: "20"
      note:
        description: "Why this run (kept in the ledger)"
        default: ""
      memory:
        description: "Also each call's peak memory"
        type: boolean
        default: false
      commit:
        description: "Commit the results to the branch (off: the artifact only)"
        type: boolean
        default: true
      gate:
        description: "First run the scale suite with a time limit and leave out the algorithms that time out, or are far slower than the main one, or grow faster with the data (bench/gate.py)"
        type: boolean
        default: true
      timeout:
        description: "Seconds one algorithm may take on one case before it is stopped (recorded as timed out; past 10 in a shard, the shard stops); 0: none"
        default: "60"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      n: ${{ steps.plan.outputs.n }}
      run_id: ${{ steps.plan.outputs.run_id }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          ALGOS: ${{ inputs.algos }}
          OTHER: ${{ inputs.other }}
        run: |
          # the Rust core (crates/) is built where an engine may run (bench/engines/rust.py): any engine, rust, or
          # algorithms chosen by status
          a="$ALGOS"
          if [ "$a" = "(other)" ]; then a="${OTHER#*|}"; fi
          case "$a" in "(status "*|*engine*|*rust*) echo "rust=true" >> "$GITHUB_OUTPUT";; *) echo "rust=false" >> "$GITHUB_OUTPUT";; esac
          n=$(python3 -c 'import os; print(max(1, min(20, int(os.environ["SHARDS"]))))')
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"
          echo "run_id=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)-gh${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.plan.outputs.rust == 'true'
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      # once for the whole run: the gate and every shard install this wheel (this commit's Rust, not a released one)
      - name: Build the Rust core
        if: steps.plan.outputs.rust == 'true'
        run: uv build --python 3.13 --wheel crates/wireskein-py --out-dir rust-wheel

      - name: Keep the Rust core's wheel
        if: steps.plan.outputs.rust == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rust-wheel
          path: rust-wheel/*.whl
          retention-days: 1

  gate:
    needs: plan
    if: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Fetch the Rust core's wheel
        if: needs.plan.outputs.rust == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rust-wheel
          path: rust-wheel

      - name: Cost run and gate
        id: gate
        env:
          STAGES: ${{ inputs.stages }}
          SUITES: ${{ inputs.suites }}
          ALGOS: ${{ inputs.algos }}
          OTHER: ${{ inputs.other }}
        run: |
          # the choices read: (other) from the other field ("suites | algorithms" when both), (status ...) as --status
          if [ "$SUITES" = "(other)" ] && [ "$ALGOS" = "(other)" ]; then
            ALGOS="${OTHER#*|}"; SUITES="${OTHER%%|*}"
          elif [ "$SUITES" = "(other)" ]; then SUITES="$OTHER"
          elif [ "$ALGOS" = "(other)" ]; then ALGOS="$OTHER"; fi
          STATUS="main,trial"
          case "$ALGOS" in "(status "*) STATUS="${ALGOS#(status }"; STATUS="${STATUS%)}"; ALGOS="";; esac
          # the Rust core's wheel the plan built, where it built one (bench/engines/rust.py)
          RUSTW=()
          if [ -d rust-wheel ]; then RUSTW=(--with "$(ls rust-wheel/*.whl)"); fi
          args=()
          for s in $STAGES; do args+=(--stage "$s"); done
          for a in $ALGOS; do args+=(--algo "$a"); done
          # the gate leaves out only algorithms other than a stage's main one: a run of main ones alone (e2e of
          # wireskein, the check of a commit on main) needs no cost run, which took 22 minutes before the shards
          rc=0
          uv run --python 3.13 "${RUSTW[@]}" --with-requirements bench/requirements.txt python bench/run.py "${args[@]}" \
            --suite scale --status "$STATUS" --has-trials || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          if [ "$rc" -eq 0 ]; then
            uv run --python 3.13 "${RUSTW[@]}" --with-requirements bench/requirements.txt python bench/run.py "${args[@]}" \
              --suite scale --status "$STATUS" --timeout 120 --note "gate" -j "$(nproc)"
            uv run --python 3.13 --with-requirements bench/requirements.txt python bench/gate.py --out skip.json
          else
            echo '{"run": null, "skip": [], "why": {}}' > skip.json
            echo "no algorithm but the main ones: no cost run, nothing left out" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$(python3 -c 'import json; print(json.dumps(json.load(open("skip.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Keep the gate
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate
          path: skip.json
          retention-days: 7

  shard:
    needs: [plan, gate]
    if: ${{ always() && needs.plan.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Fetch the Rust core's wheel
        if: needs.plan.outputs.rust == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rust-wheel
          path: rust-wheel

      - name: Run the shard
        env:
          STAGES: ${{ inputs.stages }}
          SUITES: ${{ inputs.suites }}
          ALGOS: ${{ inputs.algos }}
          OTHER: ${{ inputs.other }}
          NOTE: ${{ inputs.note }}
          MEMORY: ${{ inputs.memory }}
          SHARD: ${{ matrix.shard }}
          SKIP: ${{ needs.gate.outputs.skip }}
          TIMEOUT: ${{ inputs.timeout }}
          N: ${{ needs.plan.outputs.n }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          # the choices read: (other) from the other field ("suites | algorithms" when both), (status ...) as --status
          if [ "$SUITES" = "(other)" ] && [ "$ALGOS" = "(other)" ]; then
            ALGOS="${OTHER#*|}"; SUITES="${OTHER%%|*}"
          elif [ "$SUITES" = "(other)" ]; then SUITES="$OTHER"
          elif [ "$ALGOS" = "(other)" ]; then ALGOS="$OTHER"; fi
          STATUS="main,trial"
          case "$ALGOS" in "(status "*) STATUS="${ALGOS#(status }"; STATUS="${STATUS%)}"; ALGOS="";; esac
          # the Rust core's wheel the plan built, where it built one (bench/engines/rust.py)
          RUSTW=()
          if [ -d rust-wheel ]; then RUSTW=(--with "$(ls rust-wheel/*.whl)"); fi
          args=()
          for s in $STAGES; do args+=(--stage "$s"); done
          for s in $SUITES; do args+=(--suite "$s"); done
          for a in $ALGOS; do args+=(--algo "$a"); done
          if [ "$MEMORY" = "true" ]; then args+=(--memory); fi
          if [ -n "$SKIP" ]; then printf '%s' "$SKIP" > "$RUNNER_TEMP/skip.json"; args+=(--skip-from "$RUNNER_TEMP/skip.json"); fi
          uv run --python 3.13 "${RUSTW[@]}" --with-requirements bench/requirements.txt python bench/run.py "${args[@]}" \
            --status "$STATUS" --note "$NOTE" --shard "$SHARD/$N" --run-id "$RUN_ID" --timeout "$TIMEOUT" -j "$(nproc)"

      - name: Keep the shard's items
        uses: actions/upload-artifact@v7
        with:
          name: bench-shard-${{ matrix.shard }}
          path: bench/results/runs/
          retention-days: 7

  merge:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to commit the ledger's new lines
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      UV_PY: "--python 3.13 --with-requirements bench/requirements.txt"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Fetch the shards
        uses: actions/download-artifact@v8
        with:
          pattern: bench-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/results/runs/

      - name: Merge
        env:
          WSBENCH_RESULTS: ${{ runner.temp }}/results
        run: |
          uv run $UV_PY python bench/merge.py "$RUN_ID" --out "$WSBENCH_RESULTS/runs"
          {
            echo "### Bench run $RUN_ID"
            echo
            echo '```'
            uv run $UV_PY python bench/report.py --run "$RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ needs.plan.outputs.run_id }}
          path: ${{ runner.temp }}/results/runs/
          retention-days: 90

      - name: Commit the results
        if: ${{ inputs.commit }}
        env:
          BRANCH: ${{ github.ref_name }}
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the ledger only grows: on the branch as it is now, add this run's lines again and push; again if another
          # push came first
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            uv run $UV_PY python bench/merge.py --import "$RUNNER_TEMP/results/runs"
            git add bench/results/ledger.jsonl bench/results/runs.jsonl
            if git diff --cached --quiet; then
              echo "nothing new to commit"
              exit 0
            fi
            msg=(-m "bench: results of run $RUN_ID")
            if [ -n "$NOTE" ]; then msg+=(-m "$NOTE"); fi
            git commit --quiet "${msg[@]}"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "committed to $BRANCH: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push to $BRANCH (protected?): the run is in the artifact" >> "$GITHUB_STEP_SUMMARY"
          exit 1
