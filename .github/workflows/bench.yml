name: Bench

# The algorithm bench (bench/README.md) on GitHub's runners: started by hand, the cases split over parallel jobs (all
# algorithms of a case in one job, so that costs against main pair up), merged into ledger lines and committed to the
# branch it ran on (bench/results/ledger.jsonl, runs.jsonl: added lines only; "commit" off for a try). Every item is
# kept as the artifact bench-<run id> (uv run python bench/merge.py --import DIR takes it into a ledger).
# Scores are the same on any machine; times on shared runners are not (see bench/README.md 1.7).

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages, space separated, or all"
        default: "all"
      suites:
        description: "Suites of bench/suites.toml, space separated; all: every suite (tune: those for tuning)"
        default: "all"
      algos:
        description: "Algorithms by name, space separated (empty: by status)"
        default: ""
      status:
        description: "With no algorithm named: which statuses (main,trial,retired)"
        default: "main,trial"
      shards:
        description: "Parallel jobs (1-20)"
        default: "20"
      note:
        description: "Why this run (kept in the ledger)"
        default: ""
      memory:
        description: "Also each call's peak memory"
        type: boolean
        default: false
      commit:
        description: "Commit the results to the branch (off: the artifact only)"
        type: boolean
        default: true
      gate:
        description: "First run the cost-real suite with a time limit and leave out the algorithms that time out, or are far slower than the main one, or grow faster with the data (bench/gate.py)"
        type: boolean
        default: true
      timeout:
        description: "Seconds one algorithm may take on one case before it is stopped (recorded as timed out); 0: none"
        default: "300"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      n: ${{ steps.plan.outputs.n }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=$(python3 -c 'import os; print(max(1, min(20, int(os.environ["SHARDS"]))))')
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"
          echo "run_id=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)-gh${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    if: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Cost run and gate
        id: gate
        env:
          STAGES: ${{ inputs.stages }}
          ALGOS: ${{ inputs.algos }}
          STATUS: ${{ inputs.status }}
        run: |
          args=()
          for s in $STAGES; do args+=(--stage "$s"); done
          for a in $ALGOS; do args+=(--algo "$a"); done
          uv run --python 3.13 --with-requirements bench/requirements.txt python bench/run.py "${args[@]}" \
            --suite cost-real --status "$STATUS" --timeout 120 --note "gate" -j "$(nproc)"
          uv run --python 3.13 --with-requirements bench/requirements.txt python bench/gate.py --out skip.json
          echo "skip=$(python3 -c 'import json; print(json.dumps(json.load(open("skip.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Keep the gate
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate
          path: skip.json
          retention-days: 7

  shard:
    needs: [plan, gate]
    if: ${{ always() && needs.plan.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Run the shard
        env:
          STAGES: ${{ inputs.stages }}
          SUITES: ${{ inputs.suites }}
          ALGOS: ${{ inputs.algos }}
          STATUS: ${{ inputs.status }}
          NOTE: ${{ inputs.note }}
          MEMORY: ${{ inputs.memory }}
          SHARD: ${{ matrix.shard }}
          SKIP: ${{ needs.gate.outputs.skip }}
          TIMEOUT: ${{ inputs.timeout }}
          N: ${{ needs.plan.outputs.n }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          args=()
          for s in $STAGES; do args+=(--stage "$s"); done
          for s in $SUITES; do args+=(--suite "$s"); done
          for a in $ALGOS; do args+=(--algo "$a"); done
          if [ "$MEMORY" = "true" ]; then args+=(--memory); fi
          if [ -n "$SKIP" ]; then printf '%s' "$SKIP" > "$RUNNER_TEMP/skip.json"; args+=(--skip-from "$RUNNER_TEMP/skip.json"); fi
          uv run --python 3.13 --with-requirements bench/requirements.txt python bench/run.py "${args[@]}" \
            --status "$STATUS" --note "$NOTE" --shard "$SHARD/$N" --run-id "$RUN_ID" --timeout "$TIMEOUT" -j "$(nproc)"

      - name: Keep the shard's items
        uses: actions/upload-artifact@v7
        with:
          name: bench-shard-${{ matrix.shard }}
          path: bench/results/runs/
          retention-days: 7

  merge:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to commit the ledger's new lines
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      UV_PY: "--python 3.13 --with-requirements bench/requirements.txt"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3   # no floating major tag since v8: the full version

      - name: Fetch the shards
        uses: actions/download-artifact@v8
        with:
          pattern: bench-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/results/runs/

      - name: Merge
        env:
          WSBENCH_RESULTS: ${{ runner.temp }}/results
        run: |
          uv run $UV_PY python bench/merge.py "$RUN_ID" --out "$WSBENCH_RESULTS/runs"
          {
            echo "### Bench run $RUN_ID"
            echo
            echo '```'
            uv run $UV_PY python bench/report.py --run "$RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ needs.plan.outputs.run_id }}
          path: ${{ runner.temp }}/results/runs/
          retention-days: 90

      - name: Commit the results
        if: ${{ inputs.commit }}
        env:
          BRANCH: ${{ github.ref_name }}
          NOTE: ${{ inputs.note }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the ledger only grows: on the branch as it is now, add this run's lines again and push; again if another
          # push came first
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            uv run $UV_PY python bench/merge.py --import "$RUNNER_TEMP/results/runs"
            git add bench/results/ledger.jsonl bench/results/runs.jsonl
            if git diff --cached --quiet; then
              echo "nothing new to commit"
              exit 0
            fi
            msg=(-m "bench: results of run $RUN_ID")
            if [ -n "$NOTE" ]; then msg+=(-m "$NOTE"); fi
            git commit --quiet "${msg[@]}"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "committed to $BRANCH: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push to $BRANCH (protected?): the run is in the artifact" >> "$GITHUB_STEP_SUMMARY"
          exit 1
