[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wireskein"
version = "0.0.16"
description = "Logic-analyzer captures to protocol decodes, and waveform checks of recorded hardware test runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "TANAKA Masayuki" },
]
dependencies = [
  "numpy>=2.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
oep = ["oep-client-python[usb-async]>=0.0.34"]   # usb-async: queued IN transfers, so a stream rides out the host's jitter

[project.scripts]
wireskein = "wireskein.cli:main"

[project.urls]
Homepage = "https://github.com/Open-Embedded-Probe/wireskein"
Repository = "https://github.com/Open-Embedded-Probe/wireskein"

[dependency-groups]
dev = ["pytest>=8", "oep-client-python[usb-async]>=0.0.34"]

[tool.uv.sources]
# Until oep-client-python's next release: wireskein uses its unreleased capture (format 1 and LogicCapture.columns,
# the capture group's trigger source and trigger_caps, judge_latency_ns, the usb-async stream). Before a push, release
# it, raise the >= above to that version and drop this (CI has no ../oep-client-python).
oep-client-python = { path = "../oep-client-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/wireskein"]
artifacts = ["src/wireskein/web/**"]      # the viewer: not in git, fetched by tools/fetch_web.py

[tool.hatch.build.targets.sdist]
only-include = ["src/wireskein", "tests", "README.md", "README.ja.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/wireskein/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
