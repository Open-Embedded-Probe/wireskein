[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wireskein"
version = "0.0.28"
description = "Logic-analyzer captures to protocol decodes, and waveform checks of recorded hardware test runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "TANAKA Masayuki" },
]
dependencies = [
  "numpy>=2.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
oep = ["oep-client-python[usb-async]>=0.0.52"]   # usb-async: queued IN transfers, so a stream rides out the host's jitter; 0.0.52: capture format 1's reductions (Reduced, Part.samples)

[project.scripts]
wireskein = "wireskein.cli:main"

[project.urls]
Homepage = "https://github.com/Open-Embedded-Probe/wireskein"
Repository = "https://github.com/Open-Embedded-Probe/wireskein"

[dependency-groups]
# oep-client-python 0.0.52: format 1's reductions on the virtual probe (tests/test_oep_virtual_bench.py); pyyaml:
# tools/knowledge_decl.py reads EmbedBenchDeviceData's knowledge
dev = ["pytest>=8", "oep-client-python[usb-async]>=0.0.52", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/wireskein"]
artifacts = ["src/wireskein/web/**"]      # the viewer: not in git, fetched by tools/fetch_web.py

[tool.hatch.build.targets.sdist]
only-include = ["src/wireskein", "tests", "README.md", "README.ja.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["tests/data/i2c_bench/h417_slow"]   # 9 MB of bench captures kept in git, not shipped (their tests skip)
artifacts = ["src/wireskein/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
