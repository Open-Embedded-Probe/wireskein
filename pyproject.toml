[build-system]
# One package, WireSkein's Rust core built in (bench/notes/2026-11-24-rust-plan.ja.md §51): the wheels of the release
# are built from source by the release workflow (one per target, nothing built kept in git); here `uv sync` builds it
# (again when the Rust changes: tool.uv.cache-keys)
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "wireskein"
version = "0.1.1"
description = "Logic-analyzer captures to protocol decodes, and waveform checks of recorded hardware test runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "TANAKA Masayuki" },
]
dependencies = [
  "numpy>=2.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
oep = ["oep-client-python[usb-async]>=0.0.66"]   # usb-async: queued IN transfers, so a stream rides out the host's jitter; 0.0.66: a stream's answers ahead of its data, what was taken kept when the link fails, no frame cut in a quiet gap (0.0.63: acquire.Request's units in its names)

[project.scripts]
wireskein = "wireskein.cli:main"

[project.urls]
Homepage = "https://github.com/Open-Embedded-Probe/wireskein"
Repository = "https://github.com/Open-Embedded-Probe/wireskein"

[dependency-groups]
# oep-client-python 0.0.66 (0.0.63: acquire.Request's new names, format 1's reductions on the virtual probe, tests/test_oep_virtual_bench.py); pyyaml:
# tools/knowledge_decl.py reads EmbedBenchDeviceData's knowledge
dev = ["pytest>=8", "oep-client-python[usb-async]>=0.0.66", "pyyaml>=6"]

[tool.maturin]
manifest-path = "crates/wireskein-py/Cargo.toml"
python-source = "src"
module-name = "wireskein._core"
features = ["pyo3/extension-module"]
# the viewer: not in git (so not picked up by maturin, which follows .gitignore), fetched by tools/fetch_web.py
include = [{ path = "src/wireskein/web/**/*", format = ["wheel", "sdist"] }]

[tool.uv]
# the Rust core rebuilt when the Rust changes (uv keeps an editable build until one of these does)
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" },
              { file = "crates/*/Cargo.toml" }, { file = "crates/*/src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: a test over about 5 s (long captures): left out with -m \"not slow\" for a quick run; CI runs all"]
