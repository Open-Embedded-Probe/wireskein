# Prototype 2 of the app's screens (bench/notes/2026-11-25-gui-study.ja.md §10): the wasm side of the web one, a
# workspace of its own out of the product's (the root Cargo.toml excludes proto/), its lock beside it. A throwaway.
#   view:   what the screen's thread calls a frame (view-core's summaries and annotations into shapes for the GPU)
#   engine: what the Web Workers run (capture files read, summaries built, the analysis, the search)
[workspace]
resolver = "3"
members = ["view", "engine"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# the same version as the wasm-bindgen CLI that makes the JS glue (README)
wasm-bindgen = "=0.2.130"
view-core = { path = "../../gui/view-core" }

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
