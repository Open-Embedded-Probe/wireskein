[package]
name = "proto-egui"
description = "Prototype 1 of the app's screens: egui (eframe, wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wsk-egui"
path = "src/main.rs"

[dependencies]
view-core = { path = "../view-core" }
wireskein-io = { path = "../../../crates/wireskein-io" }
wireskein-analysis = { path = "../../../crates/wireskein-analysis" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "persistence"] }
egui_extras = { version = "0.37", default-features = false }
egui_dock = { version = "0.22", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wireskein-core = { path = "../../../crates/wireskein-core" }
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Location", "console"] }
