# Prototype 3 of the app's screens (bench/notes/2026-11-25-gui-study.ja.md §12): iced (a declarative Rust GUI, §4.3 E2),
# a workspace of its own out of the product's (the root Cargo.toml excludes proto/), its lock beside it. A throwaway.
[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[profile.release]
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
