[package]
name = "eng-rhai"
version = "0.0.1"
edition = "2021"

[dependencies]
common = { path = "../common" }
memmap2 = "0.9"
# default features only; see notes in main.rs about "unchecked"
rhai = { version = "1.26" }

[features]
# optional: disables overflow/limit checks in rhai (measured separately, not used by run.sh)
unchecked = ["rhai/unchecked"]
