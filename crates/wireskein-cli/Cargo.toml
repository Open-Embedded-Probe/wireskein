[package]
name = "wireskein-cli"
description = "WireSkein's command line in plain Rust: the subcommands of `wireskein` (analyze, decode, segments, verify, survey, states, annotate, align, convert, info) with the Rust core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wireskein-rs"
path = "src/main.rs"

[dependencies]
wireskein-core = { path = "../wireskein-core" }
wireskein-io = { path = "../wireskein-io" }
wireskein-verify = { path = "../wireskein-verify" }
serde_json = "1"
wireskein-analysis = { path = "../wireskein-analysis" }
