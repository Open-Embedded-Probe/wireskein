[package]
name = "wireskein-py"
description = "The Python module wireskein_core over wireskein-core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wireskein_core"
crate-type = ["cdylib"]

[dependencies]
ws_core = { package = "wireskein-core", path = "../wireskein-core" }
wireskein-io = { path = "../wireskein-io" }
wireskein-analysis = { path = "../wireskein-analysis" }
wireskein-verify = { path = "../wireskein-verify" }
wireskein-oep = { path = "../wireskein-oep" }
wireskein-capture = { path = "../wireskein-capture" }
wireskein-sources = { path = "../wireskein-sources" }
serde_json = "1"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
