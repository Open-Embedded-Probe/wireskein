# The Rust core for Python, a package of its own while it is built up (bench/notes/2026-11-24-rust-plan.ja.md):
# the bench installs it (uv run --with ./crates/wireskein-py ...); the wireskein package does not depend on it.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "wireskein-core"
dynamic = ["version"]
description = "WireSkein's core in Rust, for Python (built up beside the Python one)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
# rebuilt when the Rust changes (uv run --with ./crates/wireskein-py keeps a build until one of these does)
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" },
              { file = "../wireskein-core/Cargo.toml" }, { file = "../wireskein-core/src/**/*.rs" },
              { file = "../../Cargo.toml" }, { file = "../../Cargo.lock" }]
