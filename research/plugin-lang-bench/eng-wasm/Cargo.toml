[package]
name = "eng-wasm"
version = "0.0.1"
edition = "2021"

[dependencies]
common = { path = "../common" }
libc = "0.2"
# addr2line: file:line from the plugin's DWARF in trap backtraces;
# demangle: Rust symbol names in backtraces; backtrace: capture wasm backtraces.
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "backtrace", "addr2line", "demangle"] }
