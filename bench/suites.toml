# Suites: named sets of datasets. A dataset = a source x a chain of transforms (see wsbench/data.py).
# A suite's definition is never changed once results exist for it: add a new suite (noise-v2 ...) instead, so the
# ledger's numbers keep meaning what they meant.
#
# role: tune     algorithms may be adjusted on what it shows
#       holdout  looked at to confirm only; never adjusted on (the generated heldout seeds, the real records)

[suite.smoke]
role = "tune"
about = "a few cases, clean and noisy: that everything runs (seconds)"
sources = ["set:tuning[0:12]"]
transforms = ["", "spike:0.1", "bounce:0.1"]

[suite.noise]
role = "tune"
about = "100 generated cases, clean and with three kinds of noise at two or three strengths"
sources = ["set:tuning[0:100]"]
transforms = ["", "spike:0.02", "spike:0.1", "spike:0.3", "bounce:0.1", "bounce:0.5", "xtalk:0.05", "xtalk:0.3"]

[suite.noise-holdout]
role = "holdout"
about = "the same noise on cases never tuned on"
sources = ["set:heldout[0:100]"]
transforms = ["", "spike:0.02", "spike:0.1", "spike:0.3", "bounce:0.1", "bounce:0.5", "xtalk:0.05", "xtalk:0.3"]

[suite.size]
role = "tune"
about = "less data: a half, a quarter, the second half; sampled 2 and 4 times slower"
sources = ["set:tuning[0:100]"]
transforms = ["", "crop:0:0.5", "crop:0:0.25", "crop:0.5:1", "decimate:2", "decimate:4"]

[suite.stress]
role = "tune"
about = "eval's frozen stress sets: rate changes, mid-stream start, low sampling, jitter, light glitches"
sources = ["set:freqhop", "set:baudhop", "set:midstart", "set:lowrate", "set:jitter", "set:glitch"]
transforms = [""]

[suite.real]
role = "holdout"
about = "the real records of eval/corpus/real (nominal rates)"
sources = ["real"]
transforms = [""]

[suite.rate]
role = "tune"
about = "the same traffic taken at 200 MS/s and 2-16 times slower: clean, 60 ns bounces at 30 % of edges, 20 ns spikes"
sources = ["gen:mixed[0:60]@2e8"]
transforms = ["", "decimate:2", "decimate:4", "decimate:8", "decimate:16", "pbounce:0.3:60", "pbounce:0.3:60+decimate:2", "pbounce:0.3:60+decimate:4", "pbounce:0.3:60+decimate:8", "pbounce:0.3:60+decimate:16", "pspike:0.05:20", "pspike:0.05:20+decimate:2", "pspike:0.05:20+decimate:4", "pspike:0.05:20+decimate:8", "pspike:0.05:20+decimate:16"]

[suite.rate-smoke]
role = "tune"
about = "rate, on 6 scenarios"
sources = ["gen:mixed[0:6]@2e8"]
transforms = ["", "decimate:8", "pbounce:0.3:60", "pbounce:0.3:60+decimate:8"]

[suite.cost]
role = "tune"
about = "a small set for costs, run on the machine with instruction counters: sizes spread, clean and noisy"
sources = ["set:tuning[0:40]"]
transforms = ["", "spike:0.1", "bounce:0.1"]

[suite.real-i2c]
role = "holdout"
about = "real I2C through weak pull-ups (tests/data/i2c_bench/h417_slow/stream): 61 captures of 50 transactions, with and without the probe's filters and hysteresis, 20-100 MS/s"
sources = ["i2cbench:h417_slow/stream"]
transforms = [""]

[suite.real-i2c-tune]
role = "tune"
about = "real I2C of the same board, one transaction a capture (tests/data/i2c_bench/h417_slow/noise, 326 captures): to tune on, so that real-i2c stays a check"
sources = ["i2cbench:h417_slow/noise"]
transforms = [""]

[suite.nack]
role = "tune"
about = "generated cases whose I2C buses mostly address no one (eval/synth.py's stress nack: 7 in 10 NACKed), clean and noisy"
sources = ["gen:mixed/nack[0:100]"]
transforms = ["", "spike:0.1", "bounce:0.1"]

[suite.odslow]
role = "tune"
about = "generated cases with mostly NACKed I2C, its lines' rises late as through a weak pull-up (1, 2.5, 4 us; and with bounces), as the real bench's (tests/data/i2c_bench/h417_slow)"
sources = ["gen:mixed/nack[0:100]"]
transforms = ["", "odslow:1000", "odslow:2500", "odslow:4000", "odslow:2500+pbounce:0.3:60"]

[suite.segments]
role = "tune"
about = "rates that change in time: eval's baudhop (UART switching baud) and freqhop (clock per frame), clean and noisy"
sources = ["set:baudhop", "set:freqhop"]
transforms = ["", "spike:0.1", "bounce:0.1", "decimate:2"]

[suite.real-ebdd]
role = "holdout"
about = "EmbedBenchDeviceData's 35 real I2C runs (M5Stack ENV unit's SHT30 / QMP6988 with proper pull-ups, address scans, NACK answers, clock stretching; 100 / 400 kHz taken at 2 MS/s): truth the firmware's own lines. Read from bench/data since 2026-11-16 (before: ebdd:~/dev/EmbedBenchDeviceData, the same cases and input_sha)"
sources = ["ebdd:embedbench-device-data"]
transforms = [""]

[suite.rvswd-rate]
role = "tune"
about = "real WCH debug captures (eval's target-info: L103 and V203 RVSWD, V003 SWIO; 50 and 100 MS/s) taken again 2, 4, 8 times slower by decimation: how slow a capture still reads the DMI accesses right (the device's clock cannot be slowed)"
sources = ["real[4:8]"]
transforms = ["", "decimate:2", "decimate:4", "decimate:8"]

[suite.wch-fixture]
role = "tune"
about = "wch-protocols' LinkE fixture (2026-09-25), the operations under 300 kB: L103 / V203 RVSWD and V003 SWIO at 50 MS/s, V203 at 100 MS/s (truth from the 50 MHz run), extra L103 operations (LinkE speeds, clocks, errors); truth from wch-protocols' decoders"
sources = ["wchfix:l103", "wchfix:v203", "wchfix:v003", "wchfix:v203-100mhz", "wchfix:extra/l103"]
transforms = [""]

[suite.wch-ladder]
role = "tune"
about = "the fixture's L103, V003 and V203-at-100-MS/s operations decimated 2, 4, 8 times: where a slower capture stops reading the DMI accesses"
sources = ["wchfix:l103", "wchfix:v003", "wchfix:v203-100mhz"]
transforms = ["", "decimate:2", "decimate:4", "decimate:8"]

[suite.linke-l103]
role = "tune"
about = "a LinkE's RVSWD to a CH32L103 at 160 MS/s (2026-11-17: 103 ch32rv operations, LinkE speeds high / medium / low; each cut to its operation), the tuning half, and taken down to 133.3 and 50 MHz (fractional dividers, samples on the 160 MHz grid) and 80, 40, 20, 10, 8, 5 MHz (whole): where the DMI accesses stop being read; truth what ch32rv read and, taken down, the 160 MS/s reading checked against ch32rv's DMI operations. Real captures at those rates read as these do (tools/rate_compare.py)"
sources = ["linke:l103-linke-2026-11-17/tune"]
transforms = ["", "resample:133333333.3333", "decimate:2", "resample:50000000", "decimate:4", "decimate:8", "decimate:16", "decimate:20", "decimate:32"]

[suite.linke-l103-holdout]
role = "holdout"
about = "the same, the half set aside by the scenario's name (never tuned on)"
sources = ["linke:l103-linke-2026-11-17/holdout"]
transforms = ["", "resample:133333333.3333", "decimate:2", "resample:50000000", "decimate:4", "decimate:8", "decimate:16", "decimate:20", "decimate:32"]

[suite.linke-l103-rate]
role = "tune"
about = "the same LinkE -> CH32L103 operations taken by the probe itself at 160, 133.3 and 50 MHz (fractional dividers: unevenly spaced samples on the 160 MHz grid), 10, 8 and 5 MHz: that a capture taken at a lower rate reads as the 160 MS/s one taken down to it (resample / decimate); truth ch32rv's read and its DMI operations over USB"
sources = ["linke:l103-linke-2026-11-17/rate/tune"]
transforms = [""]

[suite.linke-l103-rate-holdout]
role = "holdout"
about = "the same, the operations set aside (all their rates)"
sources = ["linke:l103-linke-2026-11-17/rate/holdout"]
transforms = [""]

[suite.ebdd-50m]
role = "tune"
about = "EmbedBenchDeviceData's ENV III (SHT30 / QMP6988 on the Grove, an ESP32-P4X as controller) taken at 50 MS/s with the bus at 100 k / 400 k / 1 MHz (2026-11-17: 15 cases x 3 rates), the tuning half by the case's name, and taken down to 25, 10, 5, 2 MS/s; truth the firmware's own lines (wire-scan goes at 100 kHz whatever the bus's rate)"
sources = ["ebdd:embedbench-device-data-50m/tune"]
transforms = ["", "decimate:2", "decimate:5", "decimate:10", "decimate:25"]

[suite.ebdd-50m-holdout]
role = "holdout"
about = "the same, the cases set aside (all their bus rates)"
sources = ["ebdd:embedbench-device-data-50m/holdout"]
transforms = ["", "decimate:2", "decimate:5", "decimate:10", "decimate:25"]

[suite.cost-real]
role = "tune"
about = "costs on real captures of spread sizes (a few changes to millions): the LinkE -> CH32L103 operations taken down 4 times (40 MS/s: ringing kept, the 64 KiB read 1.8 M changes) and the ENV III I2C at 50 MS/s, the tuning halves. Run before a run with a time limit (Bench workflow's gate): an algorithm that times out, or is far slower than the main one or grows faster with the data, is left out of the run (bench/gate.py)"
sources = ["linke:l103-linke-2026-11-17/tune", "ebdd:embedbench-device-data-50m/tune"]
transforms = ["decimate:4"]
