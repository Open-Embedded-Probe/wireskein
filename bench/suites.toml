# Suites: named sets of datasets. A dataset = a source x a chain of transforms (see wsbench/data.py).
# A suite is changed where that makes its data mean more (a case too long to tell anything new, too short to hold a
# frame): what the data shows matters, not that the ledger's numbers stay comparable (a run's bench_sha tells which
# definitions it ran). long_edges / long_transforms: captures with more changes than long_edges run on long_transforms
# only; min_edges: captures with fewer changes do not run. in_all = false keeps a suite out of "all" / "tune" (run it by name).
# cycle = [[...], ...]: transforms asking one question at several strengths run one to a case, by turns over the cases
# (fixed by the case's name): the suite covers every strength, not every case at each.
# trials_in_all = false: in a run of "all" / "tune" only the main algorithms run on it (the trials there are about other
# protocols: named, the suite runs every algorithm asked for).
#
# role: tune     algorithms may be adjusted on what it shows
#       holdout  looked at to confirm only; never adjusted on (the generated heldout seeds, the real records)

[suite.smoke]
role = "tune"
about = "a few cases, clean and noisy: that everything runs (seconds)"
sources = ["set:tuning[0:12]"]
transforms = ["", "spike:0.1", "bounce:0.1"]

[suite.noise]
role = "tune"
about = "100 generated cases, clean and with three kinds of noise at two or three strengths"
sources = ["set:tuning[0:100]"]
transforms = ["", "spike:0.02", "spike:0.1", "spike:0.3", "bounce:0.1", "bounce:0.5", "xtalk:0.05", "xtalk:0.3"]
cycle = [["spike:0.02", "spike:0.1", "spike:0.3"], ["bounce:0.1", "bounce:0.5"], ["xtalk:0.05", "xtalk:0.3"]]

[suite.noise-holdout]
role = "holdout"
about = "the same noise on cases never tuned on"
sources = ["set:heldout[0:100]"]
transforms = ["", "spike:0.02", "spike:0.1", "spike:0.3", "bounce:0.1", "bounce:0.5", "xtalk:0.05", "xtalk:0.3"]
cycle = [["spike:0.02", "spike:0.1", "spike:0.3"], ["bounce:0.1", "bounce:0.5"], ["xtalk:0.05", "xtalk:0.3"]]

[suite.size]
role = "tune"
about = "less data: a half, a quarter, the second half; sampled 2 and 4 times slower"
sources = ["set:tuning[0:100]"]
transforms = ["", "crop:0:0.5", "crop:0:0.25", "crop:0.5:1", "decimate:2", "decimate:4"]

[suite.stress]
role = "tune"
about = "eval's frozen stress sets: rate changes, mid-stream start, low sampling, jitter, light glitches"
sources = ["set:freqhop", "set:baudhop", "set:midstart", "set:lowrate", "set:jitter", "set:glitch"]
transforms = [""]

[suite.real]
role = "holdout"
about = "the real records of eval/corpus/real (nominal rates)"
sources = ["real"]
transforms = [""]

[suite.rate]
role = "tune"
about = "the same traffic taken at 200 MS/s and 2-16 times slower: clean, 60 ns bounces at 30 % of edges, 20 ns spikes"
sources = ["gen:mixed[0:60]@2e8"]
transforms = ["", "decimate:2", "decimate:4", "decimate:8", "decimate:16", "pbounce:0.3:60", "pbounce:0.3:60+decimate:2", "pbounce:0.3:60+decimate:4", "pbounce:0.3:60+decimate:8", "pbounce:0.3:60+decimate:16", "pspike:0.05:20", "pspike:0.05:20+decimate:2", "pspike:0.05:20+decimate:4", "pspike:0.05:20+decimate:8", "pspike:0.05:20+decimate:16"]
cycle = [["pbounce:0.3:60", "pbounce:0.3:60+decimate:2", "pbounce:0.3:60+decimate:4", "pbounce:0.3:60+decimate:8", "pbounce:0.3:60+decimate:16"], ["pspike:0.05:20", "pspike:0.05:20+decimate:2", "pspike:0.05:20+decimate:4", "pspike:0.05:20+decimate:8", "pspike:0.05:20+decimate:16"]]

