# Heading markers (docs/markers.ja.md): the number of leading '#' is the
# level. A heading closes open sections of its level or deeper; a heading with no
# name ("##") only closes, without opening a new section. The target firmware
# treats lines starting with '#' as comments, so markers can share the command
# UART with PING/PONG and parameter lines; those stay as data inside sections.
[dialect]
name = "heading"
kind = "heading"
prefix = "#"

[[marker]]
pattern = '^(?P<hashes>#+)[ \t]*(?P<name>.*?)[ \t]*$'
action = "heading"
