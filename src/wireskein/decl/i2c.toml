# I2C: 9-bit words (8 data bits MSB first + ACK) between START and STOP/Sr,
# sampled on the SCL rising edge. The extra bit before STOP gives 9n+1.
[plugin]
name = "i2c"
input = "frames.startstop"
sample_edge = "rise"
data_pins = 1
open_tail = true      # a capture ending before STOP still reports where the transfer stopped

[roles]
clock = "scl"
data = ["sda"]

[word]
bits = 9
order = "msb"
fields = [
  { name = "byte", bits = "8:1" },
  { name = "ack",  bits = "0", expect = 0, role = "ack", record = true },
]

[frame]
length = "9n|9n+1"
first = [
  { name = "addr", from = "byte", bits = "7:1", role = "address" },
  { name = "rw",   from = "byte", bits = "0", enum = { "0" = "write", "1" = "read" } },
]
rest = { name = "bytes", from = "byte", role = "data" }

[score]
# counted by its transactions above chance (frame_score's binomial): an address no one answers is a whole transaction
# of evidence (NACK is I2C as much as ACK is), and lines whose frames fit about as often as chance stay low
count = "binomial"
chance = 0.5            # a frame's chance to fit, for the tail
above = 0.2222222222    # the rule's own chance (9n + 1: 2 in 9): the fit counted above it
soft = 0.25             # the clock-likeness and pair terms weigh this much
check_weight = 0.0
evidence_scale = 8
# START / STOP well inside SCL's high, the bus free between a STOP and the next START, no SCL over UM10204's fastest
terms = ["startstop_clearance", "bus_free", "data_once_a_bit", "max_clock_hz"]
max_clock_hz = 5e6
